name: CI
on:
  push:
    branches: [main, app-chat]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:math
      - run: npm run backtest:validate
      - run: npm run build

  # Phase 4: the public showcase and the chat server, with fake models only (no GPU, no API key, no network).
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests of the chat server and the showcase
        run: npx tsx ai/serve/mask.test.ts && npx tsx ai/serve/export.test.ts && npx tsx showcase/guard.test.ts && npx tsx ai/serve/serve.test.ts && npx tsx ai/serve/queue.test.ts
      - run: npm run showcase:build
      - run: npx playwright install --with-deps chromium
      - name: Browser suite (Playwright, desktop and phone)
        run: npx playwright test
      - name: Screenshots and traces of failed paths
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: showcase/e2e/results/
          retention-days: 14
